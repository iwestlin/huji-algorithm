logger_level: info
env: "dev"
job_type: service
debug: True

filesystem:
  cos:
    type: cos
    bucket_name: "your-bucket-appid"
    access_key_id: "your-cos-access-key-id"
    access_key_secret: "your-cos-access-key-secret"
    endpoint: "cos.ap-guangzhou.myqcloud.com"

large_model:
  confidence_threshold: 0.9
  models:
    ping_pong_singles_profession:
      predict_model_path: "$PROJECT_RESOURCES/ncnn_models/ping_pong/profession/model.ncnn.param"
    badminton_doubles:
      predict_model_path: "$PROJECT_RESOURCES/ncnn_models/badminton/doubles/model.ncnn.param"
    badminton_singles:
      predict_model_path: "$PROJECT_RESOURCES/ncnn_models/badminton/singles/model.ncnn.param"

autoclip_service_config:
  ping_pong:
    models:
      singles: ping_pong_singles_profession
  badminton:
    models:
      singles: badminton_singles
      doubles: badminton_doubles
  common:

service:
  video_result_processor_url: "/api/autoclip/result"

kafka:
  bootstrap_servers: "127.0.0.1:9094"
  consumer_group: "auto_clip_group"
  auto_offset_reset: "latest"

internal:
  http:
    base_url: http://localhost:48080/admin-api
    access_token: "your-internal-access-token"
